name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # nightly build at 1AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s  # Public repo with auth actions
    name: Build
    outputs:
      build-number: ${{ steps.build.outputs.BUILD_NUMBER }}
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.7.7
      # Build-number refs only track a number; use the existing base commit so
      # claiming a PR number does not create refs containing workflow changes.
      - name: Claim PR build number
        if: github.event_name == 'pull_request'
        uses: SonarSource/ci-github-actions/get-build-number@v2
        env:
          GITHUB_SHA: ${{ github.event.pull_request.base.sha }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        id: build
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: -Pcoverage
      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-${{ steps.build.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

  analysis:
    name: NEXT analysis
    needs: build
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.7.7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          sonar-platform: next
          artifactory-reader-role: private-reader

  promote:
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
    needs: [build, analysis]
    runs-on: github-ubuntu-latest-s  # Public repo with auth actions
    name: Promote
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    needs: [build, analysis, promote]
    if: >-
      always()
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s  # Public repo with auth actions
    name: Notify build failure
    permissions:
      actions: read      # lets the action list this run's own jobs via the GitHub API
      id-token: write    # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch || 'master') }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
